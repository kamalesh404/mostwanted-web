<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05070f"/>
      <stop offset="0.55" stop-color="#0b1226"/>
      <stop offset="1" stop-color="#1a2340"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff5a2a" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ff5a2a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232a3a"/>
      <stop offset="1" stop-color="#0c0f18"/>
    </linearGradient>
    <linearGradient id="carbody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff6a3d"/>
      <stop offset="1" stop-color="#c22b12"/>
    </linearGradient>
    <radialGradient id="lamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd9a0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffd9a0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- sky -->
  <rect width="1280" height="640" fill="url(#sky)"/>
  <circle cx="1050" cy="120" r="52" fill="#f4ead8" opacity="0.85"/>
  <circle cx="1034" cy="110" r="52" fill="#0b1226" opacity="0.9"/>

  <!-- skyline back layer -->
  <g fill="#0d1526">
    <rect x="0" y="300" width="90" height="180"/>
    <rect x="100" y="250" width="70" height="230"/>
    <rect x="180" y="330" width="100" height="150"/>
    <rect x="300" y="270" width="60" height="210"/>
    <rect x="380" y="310" width="90" height="170"/>
    <rect x="820" y="280" width="70" height="200"/>
    <rect x="900" y="330" width="110" height="150"/>
    <rect x="1020" y="260" width="80" height="220"/>
    <rect x="1110" y="320" width="80" height="160"/>
    <rect x="1200" y="290" width="80" height="190"/>
  </g>
  <!-- skyline mid layer -->
  <g fill="#131c33">
    <rect x="40" y="340" width="90" height="140"/>
    <rect x="150" y="300" width="80" height="180"/>
    <rect x="250" y="360" width="110" height="120"/>
    <rect x="380" y="330" width="70" height="150"/>
    <rect x="470" y="370" width="120" height="110"/>
    <rect x="740" y="350" width="100" height="130"/>
    <rect x="860" y="310" width="90" height="170"/>
    <rect x="970" y="360" width="120" height="120"/>
    <rect x="1110" y="340" width="90" height="140"/>
  </g>
  <!-- windows -->
  <g fill="#ffd98c" opacity="0.8">
    <rect x="60" y="360" width="8" height="12"/><rect x="80" y="360" width="8" height="12"/><rect x="100" y="392" width="8" height="12"/>
    <rect x="170" y="330" width="8" height="12"/><rect x="192" y="330" width="8" height="12"/><rect x="210" y="366" width="8" height="12"/>
    <rect x="280" y="384" width="8" height="12"/><rect x="300" y="384" width="8" height="12"/><rect x="320" y="416" width="8" height="12"/>
    <rect x="400" y="352" width="8" height="12"/><rect x="420" y="384" width="8" height="12"/>
    <rect x="880" y="336" width="8" height="12"/><rect x="902" y="366" width="8" height="12"/><rect x="924" y="336" width="8" height="12"/>
    <rect x="990" y="384" width="8" height="12"/><rect x="1010" y="416" width="8" height="12"/>
    <rect x="1130" y="366" width="8" height="12"/><rect x="1152" y="366" width="8" height="12"/>
    <rect x="490" y="392" width="8" height="12"/><rect x="510" y="392" width="8" height="12"/><rect x="530" y="424" width="8" height="12"/>
  </g>

  <!-- street glow -->
  <rect y="440" width="1280" height="200" fill="url(#glow)" opacity="0.25"/>
  <ellipse cx="640" cy="470" rx="420" ry="60" fill="url(#lamp)"/>

  <!-- road -->
  <rect y="470" width="1280" height="170" fill="url(#road)"/>
  <g stroke="#e8c95c" stroke-width="6" stroke-dasharray="46 34" opacity="0.85">
    <line x1="0" y1="560" x2="1280" y2="560"/>
  </g>
  <g stroke="#cfd6e4" stroke-width="4" opacity="0.35">
    <line x1="0" y1="500" x2="1280" y2="500"/>
  </g>

  <!-- speed streaks -->
  <g stroke="#ff5a2a" stroke-linecap="round" opacity="0.5">
    <line x1="60" y1="520" x2="240" y2="520" stroke-width="4"/>
    <line x1="120" y1="600" x2="330" y2="600" stroke-width="3"/>
    <line x1="980" y1="530" x2="1180" y2="530" stroke-width="4"/>
    <line x1="1040" y1="610" x2="1230" y2="610" stroke-width="3"/>
  </g>

  <!-- car silhouette -->
  <g transform="translate(640,560)">
    <!-- shadow -->
    <ellipse cx="0" cy="66" rx="230" ry="22" fill="#000" opacity="0.55"/>
    <!-- body -->
    <path d="M -210 40 L -218 6 Q -220 -6 -198 -10 L -120 -16 Q -70 -52 20 -52 Q 100 -50 130 -18 L 190 -12 Q 216 -8 218 8 L 212 40 Q 210 48 196 48 L 160 48 A 34 34 0 0 0 92 48 L -96 48 A 34 34 0 0 0 -164 48 L -196 48 Q -208 48 -210 40 Z" fill="url(#carbody)"/>
    <!-- cabin -->
    <path d="M -96 -14 Q -58 -44 8 -46 Q 78 -44 112 -16 L -96 -14 Z" fill="#0d1526" opacity="0.9"/>
    <!-- rim light -->
    <path d="M -210 6 Q -220 -6 -198 -10 L -120 -16 Q -70 -52 20 -52 Q 100 -50 130 -18" fill="none" stroke="#ffb499" stroke-width="3" opacity="0.9"/>
    <!-- headlight / taillight -->
    <rect x="196" y="-4" width="20" height="10" rx="4" fill="#fff3c4"/>
    <rect x="-218" y="-4" width="16" height="10" rx="4" fill="#ff2a1a"/>
    <!-- wheels -->
    <g>
      <circle cx="126" cy="48" r="34" fill="#0a0d14"/><circle cx="126" cy="48" r="15" fill="#3a4356"/>
      <circle cx="-130" cy="48" r="34" fill="#0a0d14"/><circle cx="-130" cy="48" r="15" fill="#3a4356"/>
    </g>
  </g>

  <!-- police lights hint -->
  <g opacity="0.85">
    <rect x="1160" y="392" width="70" height="26" rx="6" fill="#1b2436"/>
    <rect x="1166" y="398" width="26" height="14" rx="3" fill="#2e6bff"/>
    <rect x="1198" y="398" width="26" height="14" rx="3" fill="#ff2a3c"/>
    <circle cx="1179" cy="405" r="26" fill="#2e6bff" opacity="0.25"/>
    <circle cx="1211" cy="405" r="26" fill="#ff2a3c" opacity="0.25"/>
  </g>

  <!-- title -->
  <g text-anchor="middle">
    <text x="640" y="180" font-size="96" font-weight="900" fill="#f4f6fb" letter-spacing="4">MOST<tspan fill="#ff5a2a">WANTED</tspan>-WEB</text>
    <text x="640" y="232" font-size="26" fill="#9aa7c4" letter-spacing="6">OPEN-WORLD STREET RACING · IN THE BROWSER</text>
  </g>
</svg>
